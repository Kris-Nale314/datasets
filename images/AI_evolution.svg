<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
  <!-- Definitions for animations and gradients -->
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4285f4;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#4285f4;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f9d58;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#0f9d58;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ea4335;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#ea4335;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#673ab7;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#673ab7;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff9800;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#ff9800;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="400" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="250" y="40" font-family="Arial, sans-serif" font-weight="bold" font-size="24" text-anchor="middle" fill="#333333">AI Product Complexity Evolution</text>
  
  <!-- Canvas for each slide -->
  <g id="slide-container">
    <!-- Slide 1: Simple Data Collection (Basic) -->
    <g id="slide1">
      <rect x="100" y="80" width="300" height="220" rx="10" fill="#ffffff" stroke="#dddddd" stroke-width="2" />
      
      <text x="250" y="110" font-family="Arial, sans-serif" font-weight="bold" font-size="18" text-anchor="middle" fill="#4285f4">1. Basic Data Collection</text>
      
      <!-- Simple data points -->
      <circle cx="150" cy="160" r="8" fill="#4285f4" />
      <circle cx="180" cy="190" r="8" fill="#4285f4" />
      <circle cx="210" cy="170" r="8" fill="#4285f4" />
      <circle cx="240" cy="200" r="8" fill="#4285f4" />
      <circle cx="270" cy="150" r="8" fill="#4285f4" />
      <circle cx="300" cy="180" r="8" fill="#4285f4" />
      <circle cx="330" cy="220" r="8" fill="#4285f4" />
      
      <!-- Icon: simple database -->
      <rect x="220" y="230" width="60" height="40" rx="5" fill="none" stroke="#4285f4" stroke-width="2" />
      <line x1="220" y1="245" x2="280" y2="245" stroke="#4285f4" stroke-width="1" />
      <line x1="220" y1="260" x2="280" y2="260" stroke="#4285f4" stroke-width="1" />
      
      <!-- Animation to fade out -->
      <animate attributeName="opacity" from="1" to="0" begin="5s" dur="1s" fill="freeze" id="slide1-out" />
    </g>
    
    <!-- Slide 2: Data Processing and Analysis -->
    <g id="slide2" opacity="0">
      <rect x="100" y="80" width="300" height="220" rx="10" fill="#ffffff" stroke="#dddddd" stroke-width="2" />
      
      <text x="250" y="110" font-family="Arial, sans-serif" font-weight="bold" font-size="18" text-anchor="middle" fill="#0f9d58">2. Data Processing &amp; Analysis</text>
      
      <!-- Data Processing Flow -->
      <rect x="150" y="150" width="40" height="30" rx="5" fill="#0f9d58" opacity="0.7" />
      <text x="170" y="170" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Raw</text>
      
      <rect x="220" y="150" width="60" height="30" rx="5" fill="#0f9d58" opacity="0.8" />
      <text x="250" y="170" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Process</text>
      
      <rect x="310" y="150" width="40" height="30" rx="5" fill="#0f9d58" opacity="0.9" />
      <text x="330" y="170" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Clean</text>
      
      <!-- Connecting arrows -->
      <line x1="190" y1="165" x2="220" y2="165" stroke="#0f9d58" stroke-width="2" />
      <polygon points="220,165 215,162 215,168" fill="#0f9d58" />
      
      <line x1="280" y1="165" x2="310" y2="165" stroke="#0f9d58" stroke-width="2" />
      <polygon points="310,165 305,162 305,168" fill="#0f9d58" />
      
      <!-- Analysis chart -->
      <rect x="175" y="200" width="150" height="60" rx="5" fill="none" stroke="#0f9d58" stroke-width="2" />
      <polyline points="190,250 210,230 230,240 250,215 270,225 290,210" fill="none" stroke="#0f9d58" stroke-width="2" />
      <text x="250" y="220" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#0f9d58">Analysis</text>
      
      <!-- Animation to fade in and out -->
      <animate attributeName="opacity" from="0" to="1" begin="5s" dur="1s" fill="freeze" id="slide2-in" />
      <animate attributeName="opacity" from="1" to="0" begin="11s" dur="1s" fill="freeze" id="slide2-out" />
    </g>
    
    <!-- Slide 3: Machine Learning Model Training -->
    <g id="slide3" opacity="0">
      <rect x="100" y="80" width="300" height="220" rx="10" fill="#ffffff" stroke="#dddddd" stroke-width="2" />
      
      <text x="250" y="110" font-family="Arial, sans-serif" font-weight="bold" font-size="18" text-anchor="middle" fill="#ea4335">3. Machine Learning Training</text>
      
      <!-- Algorithm illustration -->
      <rect x="150" y="130" width="200" height="120" rx="10" fill="none" stroke="#ea4335" stroke-width="2" />
      
      <!-- Neurons and connections -->
      <circle cx="170" cy="160" r="8" fill="#ea4335" opacity="0.7" />
      <circle cx="170" cy="190" r="8" fill="#ea4335" opacity="0.7" />
      <circle cx="170" cy="220" r="8" fill="#ea4335" opacity="0.7" />
      
      <circle cx="230" cy="150" r="8" fill="#ea4335" opacity="0.8" />
      <circle cx="230" cy="180" r="8" fill="#ea4335" opacity="0.8" />
      <circle cx="230" cy="210" r="8" fill="#ea4335" opacity="0.8" />
      <circle cx="230" cy="240" r="8" fill="#ea4335" opacity="0.8" />
      
      <circle cx="290" cy="160" r="8" fill="#ea4335" opacity="0.9" />
      <circle cx="290" cy="190" r="8" fill="#ea4335" opacity="0.9" />
      <circle cx="290" cy="220" r="8" fill="#ea4335" opacity="0.9" />
      
      <!-- Connections -->
      <line x1="170" y1="160" x2="230" y2="150" stroke="#ea4335" stroke-width="1" />
      <line x1="170" y1="160" x2="230" y2="180" stroke="#ea4335" stroke-width="1" />
      <line x1="170" y1="160" x2="230" y2="210" stroke="#ea4335" stroke-width="1" />
      <line x1="170" y1="160" x2="230" y2="240" stroke="#ea4335" stroke-width="1" />
      
      <line x1="170" y1="190" x2="230" y2="150" stroke="#ea4335" stroke-width="1" />
      <line x1="170" y1="190" x2="230" y2="180" stroke="#ea4335" stroke-width="1" />
      <line x1="170" y1="190" x2="230" y2="210" stroke="#ea4335" stroke-width="1" />
      <line x1="170" y1="190" x2="230" y2="240" stroke="#ea4335" stroke-width="1" />
      
      <line x1="170" y1="220" x2="230" y2="150" stroke="#ea4335" stroke-width="1" />
      <line x1="170" y1="220" x2="230" y2="180" stroke="#ea4335" stroke-width="1" />
      <line x1="170" y1="220" x2="230" y2="210" stroke="#ea4335" stroke-width="1" />
      <line x1="170" y1="220" x2="230" y2="240" stroke="#ea4335" stroke-width="1" />
      
      <line x1="230" y1="150" x2="290" y2="160" stroke="#ea4335" stroke-width="1" />
      <line x1="230" y1="150" x2="290" y2="190" stroke="#ea4335" stroke-width="1" />
      <line x1="230" y1="150" x2="290" y2="220" stroke="#ea4335" stroke-width="1" />
      
      <line x1="230" y1="180" x2="290" y2="160" stroke="#ea4335" stroke-width="1" />
      <line x1="230" y1="180" x2="290" y2="190" stroke="#ea4335" stroke-width="1" />
      <line x1="230" y1="180" x2="290" y2="220" stroke="#ea4335" stroke-width="1" />
      
      <line x1="230" y1="210" x2="290" y2="160" stroke="#ea4335" stroke-width="1" />
      <line x1="230" y1="210" x2="290" y2="190" stroke="#ea4335" stroke-width="1" />
      <line x1="230" y1="210" x2="290" y2="220" stroke="#ea4335" stroke-width="1" />
      
      <line x1="230" y1="240" x2="290" y2="160" stroke="#ea4335" stroke-width="1" />
      <line x1="230" y1="240" x2="290" y2="190" stroke="#ea4335" stroke-width="1" />
      <line x1="230" y1="240" x2="290" y2="220" stroke="#ea4335" stroke-width="1" />
      
      <!-- Training text -->
      <text x="250" y="260" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#ea4335">Training Neural Network</text>
      
      <!-- Animation to fade in and out -->
      <animate attributeName="opacity" from="0" to="1" begin="11s" dur="1s" fill="freeze" id="slide3-in" />
      <animate attributeName="opacity" from="1" to="0" begin="17s" dur="1s" fill="freeze" id="slide3-out" />
    </g>
    
    <!-- Slide 4: Advanced Prediction and Inference -->
    <g id="slide4" opacity="0">
      <rect x="100" y="80" width="300" height="220" rx="10" fill="#ffffff" stroke="#dddddd" stroke-width="2" />
      
      <text x="250" y="110" font-family="Arial, sans-serif" font-weight="bold" font-size="18" text-anchor="middle" fill="#673ab7">4. Advanced Prediction &amp; Inference</text>
      
      <!-- AI brain visualization -->
      <circle cx="250" cy="180" r="50" fill="none" stroke="#673ab7" stroke-width="2" />
      
      <!-- Brain patterns -->
      <path d="M220,160 Q240,140 260,160 Q280,180 260,200 Q240,220 220,200 Q200,180 220,160" fill="none" stroke="#673ab7" stroke-width="1.5" />
      <path d="M230,155 Q250,145 270,155 Q275,175 270,195 Q250,205 230,195 Q225,175 230,155" fill="none" stroke="#673ab7" stroke-width="1.5" />
      
      <!-- Circuit patterns -->
      <line x1="200" y1="160" x2="220" y2="160" stroke="#673ab7" stroke-width="1" />
      <line x1="200" y1="180" x2="220" y2="180" stroke="#673ab7" stroke-width="1" />
      <line x1="200" y1="200" x2="220" y2="200" stroke="#673ab7" stroke-width="1" />
      
      <line x1="300" y1="160" x2="280" y2="160" stroke="#673ab7" stroke-width="1" />
      <line x1="300" y1="180" x2="280" y2="180" stroke="#673ab7" stroke-width="1" />
      <line x1="300" y1="200" x2="280" y2="200" stroke="#673ab7" stroke-width="1" />
      
      <!-- Data in/out -->
      <rect x="150" y="150" width="30" height="15" rx="3" fill="#673ab7" opacity="0.7" />
      <rect x="150" y="175" width="30" height="15" rx="3" fill="#673ab7" opacity="0.7" />
      <rect x="150" y="200" width="30" height="15" rx="3" fill="#673ab7" opacity="0.7" />
      
      <rect x="320" y="150" width="30" height="15" rx="3" fill="#673ab7" opacity="0.9" />
      <rect x="320" y="175" width="30" height="15" rx="3" fill="#673ab7" opacity="0.9" />
      <rect x="320" y="200" width="30" height="15" rx="3" fill="#673ab7" opacity="0.9" />
      
      <text x="250" y="260" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#673ab7">Intelligent Prediction System</text>
      
      <!-- Animation to fade in and out -->
      <animate attributeName="opacity" from="0" to="1" begin="17s" dur="1s" fill="freeze" id="slide4-in" />
      <animate attributeName="opacity" from="1" to="0" begin="23s" dur="1s" fill="freeze" id="slide4-out" />
    </g>
    
    <!-- Slide 5: Integrated AI Ecosystem -->
    <g id="slide5" opacity="0">
      <rect x="100" y="80" width="300" height="220" rx="10" fill="#ffffff" stroke="#dddddd" stroke-width="2" />
      
      <text x="250" y="110" font-family="Arial, sans-serif" font-weight="bold" font-size="18" text-anchor="middle" fill="#ff9800">5. Integrated AI Ecosystem</text>
      
      <!-- Central hub -->
      <circle cx="250" cy="180" r="35" fill="#ff9800" opacity="0.8" />
      <text x="250" y="185" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">AI Core</text>
      
      <!-- Connected systems -->
      <circle cx="170" cy="140" r="20" fill="#4285f4" opacity="0.8" />
      <text x="170" y="145" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Data</text>
      
      <circle cx="170" cy="220" r="20" fill="#ea4335" opacity="0.8" />
      <text x="170" y="225" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Models</text>
      
      <circle cx="330" cy="140" r="20" fill="#0f9d58" opacity="0.8" />
      <text x="330" y="145" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Apps</text>
      
      <circle cx="330" cy="220" r="20" fill="#673ab7" opacity="0.8" />
      <text x="330" y="225" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Users</text>
      
      <!-- Connecting lines -->
      <line x1="190" y1="140" x2="215" y2="160" stroke="#ff9800" stroke-width="2" />
      <line x1="190" y1="220" x2="215" y2="200" stroke="#ff9800" stroke-width="2" />
      <line x1="310" y1="140" x2="285" y2="160" stroke="#ff9800" stroke-width="2" />
      <line x1="310" y1="220" x2="285" y2="200" stroke="#ff9800" stroke-width="2" />
      
      <!-- Outer ring -->
      <circle cx="250" cy="180" r="100" fill="none" stroke="#ff9800" stroke-width="1" stroke-dasharray="5,5" />
      
      <text x="250" y="260" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#ff9800">Complete Ecosystem Integration</text>
      
      <!-- Animation to fade in -->
      <animate attributeName="opacity" from="0" to="1" begin="23s" dur="1s" fill="freeze" id="slide5-in" />
      
      <!-- Loop the animation by making it disappear at the end of the cycle -->
      <animate attributeName="opacity" from="1" to="0" begin="29s" dur="1s" fill="freeze" />
    </g>
  </g>
  
  <!-- Progress indicators -->
  <g id="progress-indicators">
    <circle cx="220" cy="330" r="8" fill="#4285f4">
      <animate attributeName="fill" values="#4285f4;#dddddd" begin="5s" dur="0.1s" fill="freeze" />
    </circle>
    
    <circle cx="250" cy="330" r="8" fill="#dddddd">
      <animate attributeName="fill" values="#dddddd;#0f9d58" begin="5s" dur="0.1s" fill="freeze" />
      <animate attributeName="fill" values="#0f9d58;#dddddd" begin="11s" dur="0.1s" fill="freeze" />
    </circle>
    
    <circle cx="280" cy="330" r="8" fill="#dddddd">
      <animate attributeName="fill" values="#dddddd;#ea4335" begin="11s" dur="0.1s" fill="freeze" />
      <animate attributeName="fill" values="#ea4335;#dddddd" begin="17s" dur="0.1s" fill="freeze" />
    </circle>
    
    <circle cx="310" cy="330" r="8" fill="#dddddd">
      <animate attributeName="fill" values="#dddddd;#673ab7" begin="17s" dur="0.1s" fill="freeze" />
      <animate attributeName="fill" values="#673ab7;#dddddd" begin="23s" dur="0.1s" fill="freeze" />
    </circle>
    
    <circle cx="340" cy="330" r="8" fill="#dddddd">
      <animate attributeName="fill" values="#dddddd;#ff9800" begin="23s" dur="0.1s" fill="freeze" />
      <animate attributeName="fill" values="#ff9800;#dddddd" begin="29s" dur="0.1s" fill="freeze" />
    </circle>
    
    <text x="280" y="355" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666666">Progress</text>
  </g>
  
  <!-- Complexity indicator -->
  <g id="complexity-indicator">
    <rect x="150" y="370" width="200" height="15" rx="7" fill="#eeeeee" />
    
    <rect x="150" y="370" width="40" height="15" rx="7" fill="#4285f4">
      <animate attributeName="width" values="40;40;80;80;120;120;160;160;200;200;40" begin="0s" dur="30s" keyTimes="0;0.17;0.17;0.33;0.33;0.5;0.5;0.67;0.67;0.97;1" fill="freeze" repeatCount="indefinite" />
    </rect>
    
    <text x="150" y="395" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666666">Simple</text>
    <text x="350" y="395" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666666">Complex</text>
  </g>
  
  <!-- Animation restart -->
  <g>
    <animate id="restartAnimation" attributeName="opacity" from="1" to="1" begin="30s" dur="0.1s" fill="remove" />
    
    <!-- Reset slide 1 -->
    <set attributeName="opacity" to="1" begin="restartAnimation.end" targetElement="slide1" />
    
    <!-- Reset progress indicators -->
    <set attributeName="fill" to="#4285f4" begin="restartAnimation.end" targetElement="progress-indicators" />
  </g>
</svg>